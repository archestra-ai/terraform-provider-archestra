apiVersion: storage.archestra.crossplane.io/v1alpha1
kind: BlobProvider
metadata:
  name: finops-exports
spec:
  forProvider:
    name: FinOps exports
    s3:
      bucket: acme-finops
      region: us-east-1
      keyPrefix: archestra
      authMethod: default_chain
  providerConfigRef:
    name: default
