apiVersion: llm.archestra.m.crossplane.io/v1alpha1
kind: AutoRouter
metadata:
  name: engineering
  namespace: crossplane-system
spec:
  forProvider:
    name: auto:engineering
    budgetPreset: balanced
    tiers:
      fast:
        modelIdRef:
          name: fast-model
        providerApiKeyIdRef:
          name: primary-provider
      normal:
        modelIdRef:
          name: normal-model
        providerApiKeyIdRef:
          name: primary-provider
      smart:
        modelIdRef:
          name: smart-model
        providerApiKeyIdRef:
          name: primary-provider
  providerConfigRef:
    kind: ProviderConfig
    name: default
