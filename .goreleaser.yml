# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
# The Terraform Registry file names, whatever the checkout directory is called.
project_name: terraform-provider-archestra
before:
  hooks:
    # this is just an example and not a requirement for provider building/publishing
    - go mod tidy
builds:
  - env:
      # goreleaser does not work with CGO, it could also complicate
      # usage by users in CI/CD systems like HCP Terraform where
      # they are unable to install libraries.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
# No signs or release: the release workflow runs `goreleaser release
# --skip=publish,sign`. archestra-ai/release-publisher signs SHA256SUMS with
# the registry key and the workflow uploads the zips, the manifest (as
# {{ .ProjectName }}_{{ .Version }}_manifest.json), SHA256SUMS and its
# signature to the GitHub release.
changelog:
  disable: true
