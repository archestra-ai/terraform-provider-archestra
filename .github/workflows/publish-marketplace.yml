name: Publish Upbound Marketplace

on:
  workflow_call:
    inputs:
      version:
        description: Existing Crossplane release tag to publish
        required: true
        type: string
    secrets:
      UPBOUND_ACCESS_ID:
        required: true
      UPBOUND_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing Crossplane release tag to publish (e.g. v3.0.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upbound-marketplace-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Upbound Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Marketplace assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Install Upbound CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.upbound.io/stable/v0.55.0/bin/linux_amd64/up \
            --output "$RUNNER_TEMP/up"
          echo "92faee16e91d39204ec7e45d2b1f63c2d741045ffb8cf9cfbac8ba2972ac69e6  $RUNNER_TEMP/up" | sha256sum --check
          chmod +x "$RUNNER_TEMP/up"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Log in to Marketplace registry
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$UPBOUND_TOKEN" | docker login xpkg.upbound.io \
            --username "$UPBOUND_ACCESS_ID" --password-stdin

      - name: Publish release with Marketplace assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="xpkg.upbound.io/archestra/provider-archestra:$VERSION"
          docker buildx imagetools inspect --raw "$package" > "$RUNNER_TEMP/marketplace-source.json"
          up xpkg append --extensions-root=crossplane/marketplace \
            --destination="$package" "$package"
          docker buildx imagetools inspect --raw "$package" > "$RUNNER_TEMP/marketplace-destination.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def runtimes(filename):
              index = json.loads((Path(os.environ["RUNNER_TEMP"]) / filename).read_text())
              return {
                  (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item["digest"]
                  for item in index["manifests"]
                  if item.get("platform", {}).get("os") == "linux"
              }

          source = runtimes("marketplace-source.json")
          destination = runtimes("marketplace-destination.json")
          for platform in (("linux", "amd64"), ("linux", "arm64")):
              if platform not in source or source[platform] != destination.get(platform):
                  raise SystemExit(f"Published runtime differs from release for {platform}")
          print("Verified unchanged linux/amd64 and linux/arm64 release runtimes")
          PY
          printf 'Added Marketplace assets to [%s](https://marketplace.upbound.io/providers/archestra/provider-archestra/%s).\n' \
            "$package" "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable Marketplace listing for the existing repository
        env:
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$UPBOUND_TOKEN" | up login --token=- \
            --profile=marketplace --organization=archestra
          up repository update provider-archestra \
            --profile=marketplace --organization=archestra \
            --private=false --publish=true --force
          up repository get provider-archestra \
            --profile=marketplace --organization=archestra --format=json
          echo 'Enabled the public Marketplace listing for archestra/provider-archestra.' >> "$GITHUB_STEP_SUMMARY"
