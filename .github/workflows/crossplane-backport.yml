# NOTE(negz/upstream): This is a risky target, but we run this action only
# when and if a PR is closed, then filter down to specifically merged PRs.
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
name: Crossplane Backport

on:
  pull_request_target:
    types: [closed]

jobs:
  open-pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'area/crossplane')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Open Backport PR
        uses: korthout/backport-action@7c3f6cd5843cac11bc59a04a1b7699af93261670 # v4.5
