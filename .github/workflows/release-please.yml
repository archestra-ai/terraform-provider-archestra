name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Default to read-only; jobs request extra scopes as needed.
permissions:
  contents: read

concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  group: "release-please-${{ github.ref_name }}-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release tags and commits
      pull-requests: write # open/update release PRs
      issues: write # label release PRs
      id-token: write # OIDC for action identity
    outputs:
      # Manifest mode with multiple packages -> outputs are path-namespaced.
      tf_release_created: ${{ steps.release-please.outputs['.--release_created'] }}
      crossplane_release_created: ${{ steps.release-please.outputs['crossplane--release_created'] }}
      crossplane_tag_name: ${{ steps.release-please.outputs['crossplane--tag_name'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate a token
        id: generate-token
        uses: ./.github/actions/generate-release-token
        with:
          app-id: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.ARCHESTRA_RELEASER_GITHUB_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]

      - uses: googleapis/release-please-action@c2a5a2bd6a758a0937f1ddb1e8950609867ed15c # v4.3.0
        id: release-please
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main

      - name: Log release-please outputs
        # HACK to get toJson to sorta print the output to the console without failing this job
        continue-on-error: true
        env:
          OUTPUTS: ${{ toJson(steps.release-please.outputs) }}
        run: |
          echo "$OUTPUTS"

  publish-terraform-provider:
    name: Publish Terraform Provider
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.tf_release_created == 'true'
    permissions:
      contents: write # publish release assets
      id-token: write # OIDC for goreleaser
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Allow goreleaser to access older tag information.
          # zizmor: ignore[artipacked] goreleaser needs git credentials to push release tags
          persist-credentials: true

      - name: Setup go
        uses: ./.github/actions/setup-go

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          passphrase: ${{ secrets.GPG_PASSPHRASE }} # zizmor: ignore[secrets-outside-env]

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  publish-crossplane:
    name: Publish Crossplane Provider
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.crossplane_release_created == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true              # crossplane/build makelib
          fetch-depth: 0                # makelib derives VERSION from git
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          install: true
          cache-binary: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'

      - name: Build Terraform provider
        run: go build -o terraform-provider-archestra .

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/

      - name: Build and publish provider package
        env:
          UP_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
          TAG: ${{ needs.release-please.outputs.crossplane_tag_name }}
        run: |
          set -euo pipefail
          # release-please tags the Crossplane package crossplane-vX.Y.Z;
          # the xpkg is published as vX.Y.Z.
          VERSION="${TAG#crossplane-}"
          up login --token "$UP_TOKEN"
          make -C crossplane generate
          make -C crossplane build publish \
            XPKG_REG_ORGS="xpkg.upbound.io/archestra" \
            VERSION="$VERSION"
