name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publisher_smoke:
        description: Dry-run the publisher (main only) - build, sign and upload to a draft release; writes no release, tag or package
        required: false
        type: boolean
        default: false
      release_tag:
        description: Publish an existing release tag (vX.Y.Z on main) whose release has no assets yet (main only)
        required: false
        type: string
        default: ''

# Default to read-only; jobs request extra scopes as needed.
permissions:
  contents: read

concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  group: "release-please-${{ github.ref_name }}-${{ github.head_ref }}"
  # A release run waits for its approval in the publisher; a later push must
  # not cancel it between the publish and the asset upload. Later pushes queue.
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ !inputs.publisher_smoke && !inputs.release_tag }}
    name: Release Please
    # Single-package manifest mode -> release outputs are flat (no `<path>--` prefix).
    permissions: {} # The shared workflow writes with the archestra-releaser App token only.
    uses: archestra-ai/.github/.github/workflows/release-please.yml@dc1baa65f528a62f6623c86a748824c9c4c925a7 # v1.17.0
    with:
      # The archestra-releaser App's key lives only in this environment, which
      # only main can deploy to.
      environment: releaser
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Builds the release without any secret: the goreleaser zips, registry
  # manifest and SHA256SUMS (unsigned), and the Crossplane package made from
  # those same zips, staged in ghcr.io/archestra-ai/ci. Only the publisher
  # (archestra-ai/release-publisher) holds the signing key and the Upbound
  # token.
  build-release:
    name: Build release
    needs: release-please
    if: >-
      ${{ always() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       ((inputs.publisher_smoke || inputs.release_tag != '') && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # check out the release commit
      packages: write # stage the Crossplane package in ghcr.io/archestra-ai/ci
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      package_digest: ${{ steps.package.outputs.digest }}
    steps:
      - name: Version
        id: version
        env:
          RELEASED_TAG: ${{ needs.release-please.outputs.tag_name }}
          EXISTING_TAG: ${{ inputs.release_tag }}
          SMOKE: ${{ inputs.publisher_smoke }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$SMOKE" = true ]; then
            [ -z "$EXISTING_TAG" ] || { echo "::error::publisher_smoke and release_tag are exclusive"; exit 1; }
            version="0.0.0-smoke.$RUN_ID"
          else
            tag="${EXISTING_TAG:-$RELEASED_TAG}"
            version="${tag#v}"
          fi
          python3 -c 'import re, sys; assert re.fullmatch(r"\d+\.\d+\.\d+(-smoke\.\d+)?", sys.argv[1])' "$version"
          { echo "version=$version"; echo "tag=v$version"; } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # crossplane/build makelib
          fetch-depth: 0 # goreleaser and makelib read tags
          persist-credentials: false

      # Publishing an existing tag: build the tag's provider and Crossplane
      # sources with this run's (main's) build tooling, so the package uses
      # the release's own zips. The tag must be on main; the publisher checks
      # that too.
      - name: Check out the existing tag
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "refs/tags/$TAG" "$GITHUB_SHA" || { echo "::error::$TAG is not on main"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' | grep -qx 0 \
            || { echo "::error::$TAG's release is missing or already has assets"; exit 1; }
          git checkout --quiet "refs/tags/$TAG"
          git submodule update --init --quiet
          git checkout "$GITHUB_SHA" -- .goreleaser.yml crossplane/cluster/images/provider-archestra/Makefile

      - name: Setup go
        uses: $/.github/actions/setup-go

      # Release: the tag release-please just made is at HEAD. Dry run: no tag,
      # so goreleaser takes the smoke version and skips its tag checks.
      - name: Build the provider (unsigned)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # validate checks the tag is at a clean HEAD: not for a dry run (no
          # tag) or an existing tag (main's build tooling is laid over it).
          args: release --clean --skip=publish,sign${{ (inputs.publisher_smoke || inputs.release_tag != '') && ',validate' || '' }}
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

      # The Terraform Registry's file set: one zip per platform, the manifest
      # (named as goreleaser lists it in SHA256SUMS) and SHA256SUMS. The
      # publisher signs SHA256SUMS.
      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prefix="terraform-provider-archestra_${VERSION}"
          mkdir -p "$RUNNER_TEMP/release-provider"
          cp dist/"${prefix}"_*.zip dist/"${prefix}_SHA256SUMS" "$RUNNER_TEMP/release-provider/"
          cp terraform-registry-manifest.json "$RUNNER_TEMP/release-provider/${prefix}_manifest.json"
          (cd "$RUNNER_TEMP/release-provider" && sha256sum --check --strict "${prefix}_SHA256SUMS")
          ls -l "$RUNNER_TEMP/release-provider"

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provider
          path: ${{ runner.temp }}/release-provider
          if-no-files-found: error
          retention-days: 30

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Install goimports
        run: go -C crossplane install golang.org/x/tools/cmd/goimports

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      # The package's images unpack the zips built above (provider-zips in the
      # image build context), not a download from the GitHub release, so it
      # holds exactly the binaries the publisher verifies and signs.
      - name: Build and stage the Crossplane package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go build -o terraform-provider-archestra .
          make -C crossplane generate TERRAFORM_PROVIDER_VERSION="$VERSION"
          make -C crossplane build.all publish \
            PLATFORMS="linux_amd64 linux_arm64" \
            XPKG_REG_ORGS="ghcr.io/archestra-ai/ci" \
            TERRAFORM_PROVIDER_VERSION="$VERSION" \
            TERRAFORM_PROVIDER_ZIP_DIR="$RUNNER_TEMP/release-provider" \
            VERSION="v$VERSION"

      - name: Install Upbound CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.upbound.io/stable/v0.55.0/bin/linux_amd64/up \
            --output "$RUNNER_TEMP/up"
          echo "92faee16e91d39204ec7e45d2b1f63c2d741045ffb8cf9cfbac8ba2972ac69e6  $RUNNER_TEMP/up" | sha256sum --check
          chmod +x "$RUNNER_TEMP/up"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Add Marketplace assets to the staged package
        id: package
        env:
          PACKAGE: ghcr.io/archestra-ai/ci/provider-archestra:v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$PACKAGE" > "$RUNNER_TEMP/marketplace-source.json"
          up xpkg append --extensions-root=crossplane/marketplace --destination="$PACKAGE" "$PACKAGE"
          docker buildx imagetools inspect --raw "$PACKAGE" > "$RUNNER_TEMP/marketplace-destination.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def runtimes(filename):
              index = json.loads((Path(os.environ["RUNNER_TEMP"]) / filename).read_text())
              return {
                  (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item["digest"]
                  for item in index["manifests"]
                  if item.get("platform", {}).get("os") == "linux"
              }

          source = runtimes("marketplace-source.json")
          destination = runtimes("marketplace-destination.json")
          for platform in (("linux", "amd64"), ("linux", "arm64")):
              if platform not in source or source[platform] != destination.get(platform):
                  raise SystemExit(f"Marketplace assets changed the {platform} runtime")
          print("Verified unchanged linux/amd64 and linux/arm64 runtimes")
          PY
          echo "digest=sha256:$(sha256sum "$RUNNER_TEMP/marketplace-destination.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  # Attests what build-release made, asks the publisher to verify, sign and
  # publish it, then uploads the signed files to this repository's release.
  # Retry with "Re-run failed jobs": this job attests the same files and
  # package again in the new attempt.
  attest-release:
    name: Attest release
    needs: [release-please, build-release]
    if: ${{ always() && !cancelled() && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # download the release files
      attestations: write # store the build provenance attestation
      id-token: write # sign the build provenance attestation
    outputs:
      images: ${{ steps.subjects.outputs.images }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provider
          path: release-provider

      # Each file under its own name, and the package digest under its public
      # name: the publisher accepts nothing else from this run.
      - name: Collect release subjects
        id: subjects
        env:
          PACKAGE_DIGEST: ${{ needs.build-release.outputs.package_digest }}
        run: |
          set -euo pipefail
          python3 -c 'import re, sys; assert re.fullmatch(r"sha256:[0-9a-f]{64}", sys.argv[1])' "$PACKAGE_DIGEST"
          (cd release-provider && sha256sum -- *) > release-subjects.txt
          echo "${PACKAGE_DIGEST#sha256:}  xpkg.upbound.io/archestra/provider-archestra" >> release-subjects.txt
          echo "images=$(jq -cn --arg digest "$PACKAGE_DIGEST" '{"xpkg.upbound.io/archestra/provider-archestra": $digest}')" >> "$GITHUB_OUTPUT"
          cat release-subjects.txt

      - name: Attest the release files and package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-subjects.txt

  # Waits for the publisher, a stable release's approval included, up to 360
  # minutes. The publisher signs SHA256SUMS, pushes the package to Upbound and
  # returns the signed files as this run's release-assets artifact.
  publish-release:
    name: Publish release
    needs: [build-release, attest-release]
    if: ${{ always() && !cancelled() && needs.attest-release.result == 'success' }}
    permissions:
      actions: read # download this run's release files
    uses: archestra-ai/.github/.github/workflows/release-publish.yml@99f2e3eb74603dbe4b785982467aed3ab28fc082 # v1.20.0
    with:
      # Holds the archestra-releaser App's key; main only.
      environment: releaser
      project: terraform-provider-archestra
      version: ${{ needs.build-release.outputs.version }}
      images: ${{ needs.attest-release.outputs.images }}
      asset-artifact: release-provider
      return-artifact: release-assets
      smoke: ${{ inputs.publisher_smoke || false }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  upload-release:
    name: Upload release assets
    needs: [build-release, publish-release]
    if: ${{ always() && !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # download the release files and the signed assets
      contents: write # upload the release assets (a dry run: create a draft release)
    env:
      SMOKE: ${{ inputs.publisher_smoke && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provider
          path: release-provider

      - name: Download the signed release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # Checks the signature against the registry's public key and that every
      # returned file is what build-release made, then uploads.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$SMOKE" = true ]; then
            python3 -I scripts/upload-release-assets.py release-assets "publisher-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --built release-provider --draft-for-smoke "$GITHUB_SHA"
          else
            python3 -I scripts/upload-release-assets.py release-assets "$TAG" --built release-provider
          fi

  verify-marketplace:
    name: Verify Marketplace listing
    needs: [build-release, upload-release]
    if: ${{ !inputs.publisher_smoke && needs.upload-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public Marketplace listing and logo
        env:
          VERSION: v${{ needs.build-release.outputs.version }}
          DIGEST: ${{ needs.build-release.outputs.package_digest }}
        run: |
          set -euo pipefail
          python3 scripts/verify-marketplace.py "$VERSION" --digest="$DIGEST"
          printf 'Verified public [%s](https://marketplace.upbound.io/providers/archestra/provider-archestra/%s), release digest, and Archestra SVG logo.\n' \
            "$VERSION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
