name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      marketplace_version:
        description: 'Repair Marketplace assets for an existing release (e.g. v3.0.3); leave empty for release-please'
        required: false
        type: string

# Default to read-only; jobs request extra scopes as needed.
permissions:
  contents: read

concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  group: "release-please-${{ github.ref_name }}-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  release-please:
    if: inputs.marketplace_version == ''
    name: Release Please
    # Single-package manifest mode -> release outputs are flat (no `<path>--` prefix).
    permissions: {} # The shared workflow writes with the archestra-releaser App token only.
    uses: archestra-ai/.github/.github/workflows/release-please.yml@dc1baa65f528a62f6623c86a748824c9c4c925a7 # v1.17.0
    with:
      # The archestra-releaser App's key lives only in this environment, which
      # only main can deploy to.
      environment: releaser
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  publish-terraform-provider:
    name: Publish Terraform Provider
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Holds GPG_PRIVATE_KEY and GPG_PASSPHRASE; deployable from main only.
    environment:
      name: release
      deployment: false # A secrets and branch gate; nothing is deployed.
    permissions:
      contents: write # publish release assets
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Allow goreleaser to access older tag information.
          # zizmor: ignore[artipacked] goreleaser needs git credentials to push release tags
          persist-credentials: true

      - name: Setup go
        uses: $/.github/actions/setup-go

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  publish-crossplane:
    name: Publish Crossplane Provider
    runs-on: ubuntu-latest
    needs: [release-please, publish-terraform-provider]
    if: >-
      always() && !cancelled() &&
      ((needs.release-please.outputs.release_created == 'true' && needs.publish-terraform-provider.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.marketplace_version != ''))
    # Holds UPBOUND_ACCESS_ID and UPBOUND_TOKEN; deployable from main only.
    environment:
      name: release
      deployment: false # A secrets and branch gate; nothing is deployed.
    env:
      VERSION: ${{ inputs.marketplace_version || needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true              # crossplane/build makelib
          fetch-depth: 0                # makelib derives VERSION from git
          persist-credentials: false

      - name: Validate existing release for asset repair
        if: inputs.marketplace_version != ''
        run: |
          set -euo pipefail
          python3 -c 'import os, re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["VERSION"]), "Expected a stable release tag"'
          git rev-parse --verify "refs/tags/$VERSION^{commit}" > /dev/null

      - name: Setup QEMU
        if: inputs.marketplace_version == ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Setup Go
        if: inputs.marketplace_version == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            crossplane/go.sum

      - name: Build Terraform provider
        if: inputs.marketplace_version == ''
        run: go build -o terraform-provider-archestra .

      - name: Install goimports
        if: inputs.marketplace_version == ''
        run: go -C crossplane install golang.org/x/tools/cmd/goimports

      - name: Log in to Upbound registry
        # `make publish` shells out to `crank xpkg push`, which is a Docker
        # registry push — it reads creds from ~/.docker/config.json, not from
        # the Upbound CLI's session.
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          set -euo pipefail
          echo "$UPBOUND_TOKEN" | docker login xpkg.upbound.io \
            --username "$UPBOUND_ACCESS_ID" --password-stdin

      - name: Build and publish provider package
        if: inputs.marketplace_version == ''
        run: |
          set -euo pipefail
          # `make build` only builds for the host arch via BUILD_PLATFORMS;
          # `build.all` honors PLATFORMS so both linux_amd64 and linux_arm64
          # xpkgs are produced — `crank xpkg push` needs both.
          provider_version="${VERSION#v}"
          make -C crossplane generate TERRAFORM_PROVIDER_VERSION="$provider_version"
          make -C crossplane build.all publish \
            PLATFORMS="linux_amd64 linux_arm64" \
            XPKG_REG_ORGS="xpkg.upbound.io/archestra" \
            TERRAFORM_PROVIDER_VERSION="$provider_version" \
            VERSION="$VERSION"

      - name: Install Upbound CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.upbound.io/stable/v0.55.0/bin/linux_amd64/up \
            --output "$RUNNER_TEMP/up"
          echo "92faee16e91d39204ec7e45d2b1f63c2d741045ffb8cf9cfbac8ba2972ac69e6  $RUNNER_TEMP/up" | sha256sum --check
          chmod +x "$RUNNER_TEMP/up"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Add Marketplace assets to provider package
        run: |
          set -euo pipefail
          package="xpkg.upbound.io/archestra/provider-archestra:$VERSION"
          docker buildx imagetools inspect --raw "$package" > "$RUNNER_TEMP/marketplace-source.json"
          up xpkg append --extensions-root=crossplane/marketplace \
            --destination="$package" "$package"
          docker buildx imagetools inspect --raw "$package" > "$RUNNER_TEMP/marketplace-destination.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def runtimes(filename):
              index = json.loads((Path(os.environ["RUNNER_TEMP"]) / filename).read_text())
              return {
                  (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")): item["digest"]
                  for item in index["manifests"]
                  if item.get("platform", {}).get("os") == "linux"
              }

          source = runtimes("marketplace-source.json")
          destination = runtimes("marketplace-destination.json")
          for platform in (("linux", "amd64"), ("linux", "arm64")):
              if platform not in source or source[platform] != destination.get(platform):
                  raise SystemExit(f"Published runtime differs from release for {platform}")
          print("Verified unchanged linux/amd64 and linux/arm64 release runtimes")
          PY
          printf 'Added Marketplace assets to [%s](https://marketplace.upbound.io/providers/archestra/provider-archestra/%s).\n' \
            "$package" "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public Marketplace listing and logo
        run: |
          set -euo pipefail
          digest="sha256:$(sha256sum "$RUNNER_TEMP/marketplace-destination.json" | cut -d ' ' -f 1)"
          python3 scripts/verify-marketplace.py "$VERSION" --digest="$digest"
          printf 'Verified public [%s](https://marketplace.upbound.io/providers/archestra/provider-archestra/%s), release digest, and Archestra SVG logo.\n' \
            "$VERSION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
