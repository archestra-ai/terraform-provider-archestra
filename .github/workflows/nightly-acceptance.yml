name: Nightly Acceptance Tests

# Runs the acceptance suites against the oldest supported Archestra release,
# the newest stable release and the tested release in platform-version.txt.
# Pull request CI tests only the tested release.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly-acceptance.yml
      - .github/actions/acceptance-tests/**
      - .github/actions/credential-acceptance-tests/**
      - scripts/nightly-platform-versions.sh

permissions:
  contents: read

concurrency:
  group: nightly-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  releases:
    name: Select Archestra releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select releases
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/nightly-platform-versions.sh | tee -a "$GITHUB_OUTPUT"

  acceptance-tests:
    name: Acceptance Tests (${{ matrix.version }}, ${{ matrix.role }})
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Pull request CI checks the generated client against the tested
      # release. Other releases have other specs, so skip that check here.
      - name: Run acceptance tests
        uses: ./.github/actions/acceptance-tests
        with:
          archestra-version: ${{ matrix.version }}
          check-generated-client: "false"

  credential-acceptance-tests:
    name: Credential Acceptance Tests (${{ matrix.version }}, ${{ matrix.role }})
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run credential acceptance tests
        uses: ./.github/actions/credential-acceptance-tests
        with:
          archestra-version: ${{ matrix.version }}
          check-generated-client: "false"

  report:
    name: Report nightly result
    needs: [releases, acceptance-tests, credential-acceptance-tests]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # Open, update or close the nightly failure issue.
    steps:
      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly acceptance tests failed"
          issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ "$FAILED" = "true" ]; then
            body="Nightly acceptance tests failed: ${RUN_URL}"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "${body}

          The run tests the oldest supported Archestra release, the newest stable release and the tested release in \`platform-version.txt\`. This issue closes when a nightly run passes."
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Nightly acceptance tests pass again: ${RUN_URL}"
          fi
