name: Provider Audit Tooling

on:
  pull_request:
    paths:
      - 'scripts/provider-api-audit.py'
      - 'scripts/provider-sync-plan.py'
      - 'scripts/bootstrap-local-stack.sh'
      - 'scripts/bootstrap-vault.sh'
      - 'scripts/ci_*.py'
      - 'scripts/bootstrap-api-key.sh'
      - 'scripts/bootstrap-test-llm-key.py'
      - 'scripts/bootstrap-crossplane.sh'
      - 'scripts/test_*.py'
      - '.github/provider-sync/**'
      - '.github/workflows/provider-audit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test planning and stack isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test read-only planning and local stack isolation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check bootstrap shell syntax
        run: |
          bash -n scripts/bootstrap-local-stack.sh
          bash -n scripts/bootstrap-crossplane.sh
