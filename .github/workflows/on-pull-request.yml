name: On Pull Requests

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  # For merge queue, we use merge_group to ensure each merge queue run gets its own group.
  group: "on-pull-requests-${{ github.ref_name }}-${{ github.head_ref }}-${{ github.event.merge_group.head_sha || '' }}"
  cancel-in-progress: true

jobs:
  integration-scope:
    name: Select integration scope
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test integration routing
        run: python3 -m unittest discover -s scripts -p test_ci_integration_scope.py
      - name: Select native integration scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci_integration_scope.py --suite native \
            --event "$EVENT" --head-ref "$HEAD_REF" --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  lint-pr-title:
    name: PR Title Linter
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint PR title
        uses: grafana/shared-workflows/actions/lint-pr-title@70c40e5b6522c854a55334124545261cae3d4c73 # lint-pr-title/v1.2.4
        with:
          config-path: "${{ github.workspace }}/.github/commitlint.config.js"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linting-and-tests:
    name: Linting and Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup go
        uses: $/.github/actions/setup-go

      - name: Setup Terraform
        uses: $/.github/actions/setup-terraform

      - name: Ensure go mod is "tidy"
        run: |
          go mod tidy -diff
          cd tools && go mod tidy -diff

      - name: Linting
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          # The action's own check fetches the schema from golangci-lint.run, which times out from runners.
          verify: false

      - name: Verify the golangci-lint configuration
        run: golangci-lint config verify --schema https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.4/jsonschema/golangci.jsonschema.json

      - name: Ensure formatting and generation are up to date
        run: |
          make fmt
          make generate

          if ! git diff --exit-code; then
            echo "🔴🔴🔴: There are uncommitted changes. Please run 'make lint', 'make fmt', and 'make generate' and commit the changes. 🔴🔴🔴"
            exit 1
          fi

      - name: Unit Tests
        run: make test

      - name: Build
        run: make build

      # Keeps the published examples in step with the schema.
      - name: Validate examples
        run: make validate-examples

      - name: Compile the live acceptance test runtime
        id: native-runtime
        run: |
          if python3 scripts/ci_acceptance_tests.py --cache-supported; then
            mkdir -p "$RUNNER_TEMP/native-runtime"
            go test -c -cover -o "$RUNNER_TEMP/native-runtime/native-acceptance.test" ./internal/provider
            python3 scripts/ci_runtime_manifest.py write "$RUNNER_TEMP/native-runtime/manifest.json" \
              "$RUNNER_TEMP/native-runtime/native-acceptance.test"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the acceptance test runtime
        if: steps.native-runtime.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-runtime
          key: native-runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  acceptance-tests:
    name: Acceptance Tests
    needs: [integration-scope, acceptance-shards]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every acceptance shard
        env:
          SCOPE: ${{ needs.integration-scope.result }}
          RUN: ${{ needs.integration-scope.outputs.run }}
          SHARDS: ${{ needs.acceptance-shards.result }}
        run: |
          test "$SCOPE" = success
          if [ "$RUN" = true ]; then test "$SHARDS" = success; fi

  credential-acceptance-tests:
    name: Credential Acceptance Tests
    needs: integration-scope
    if: ${{ !cancelled() && (needs.integration-scope.result != 'success' || needs.integration-scope.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful integration scope
        if: needs.integration-scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read platform version
        run: ./scripts/platform-version.sh >> "$GITHUB_ENV"
      - name: Run credential acceptance tests
        uses: $/.github/actions/credential-acceptance-tests
        with:
          archestra-version: ${{ env.ARCHESTRA_VERSION }}

  # Runtime changes and releases run both acceptance suites against the oldest
  # supported release and the newest stable release. The job
  # names carry the role, not the version, so the checks can be required.
  older-releases:
    name: Select older Archestra releases
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      acceptance-matrix: ${{ steps.acceptance.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select releases
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/supported-platform-versions.sh | tee -a "$GITHUB_OUTPUT"

      - name: Select isolated acceptance shards
        id: acceptance
        env:
          OLDER_MATRIX: ${{ steps.select.outputs.matrix }}
        run: |
          tested=$(./scripts/platform-version.sh)
          matrix=$(jq -cn --argjson older "$OLDER_MATRIX" --arg tested "${tested#ARCHESTRA_VERSION=}" '
            {include: ([{role: "tested", version: $tested}] + $older.include |
              map(. as $release | range(1; 5) as $shard | $release + {shard: $shard, shards: 4}))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  acceptance-shards:
    name: Native acceptance (${{ matrix.role }}, shard ${{ matrix.shard }})
    needs: [older-releases, integration-scope]
    if: ${{ !cancelled() && needs.integration-scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.older-releases.outputs.acceptance-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run acceptance shard
        uses: $/.github/actions/acceptance-tests
        with:
          archestra-version: ${{ matrix.version }}
          check-generated-client: ${{ matrix.role == 'tested' && matrix.shard == 1 && 'true' || 'false' }}
          shard: ${{ matrix.shard }}
          shard-count: ${{ matrix.shards }}

  acceptance-tests-older-releases:
    name: Acceptance Tests (${{ matrix.role }})
    needs: [older-releases, integration-scope, acceptance-shards]
    # Both role checks require the complete native matrix, including failures and cancellation.
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.older-releases.outputs.matrix) }}
    steps:
      - name: Require every acceptance shard
        env:
          SCOPE: ${{ needs.integration-scope.result }}
          RUN: ${{ needs.integration-scope.outputs.run }}
          SHARDS: ${{ needs.acceptance-shards.result }}
        run: |
          test "$SCOPE" = success
          if [ "$RUN" = true ]; then test "$SHARDS" = success; fi

  credential-acceptance-tests-older-releases:
    name: Credential Acceptance Tests (${{ matrix.role }})
    needs: [older-releases, integration-scope]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.older-releases.outputs.matrix) }}
    steps:
      - name: Require successful integration scope
        if: needs.integration-scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.integration-scope.outputs.run == 'true'
        with:
          persist-credentials: false
      - name: Run credential acceptance tests
        if: needs.integration-scope.outputs.run == 'true'
        uses: $/.github/actions/credential-acceptance-tests
        with:
          archestra-version: ${{ matrix.version }}
          check-generated-client: "false"
