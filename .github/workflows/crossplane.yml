name: Crossplane Provider

# CI for the Crossplane provider (crossplane/ — its own Go module).
# Pushes to main are path-filtered; pull requests always run it.
on:
  push:
    branches: [main]
    paths:
      - 'crossplane/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/crossplane.yml'
  # Every pull request runs this job, so "Generate & Build" can be a required
  # check. It includes the test that every Terraform resource has a Crossplane
  # mapping in both scopes.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Generate & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true   # crossplane/build makelib
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            crossplane/go.sum

      # The Crossplane provider's CRDs are generated from the Terraform
      # provider's schema. In this monorepo that is a local build step:
      # build the binary, then `make generate` dumps its schema and runs
      # upjet codegen against it.
      - name: Build Terraform provider
        run: go build -o terraform-provider-archestra .

      - name: Install goimports
        run: go -C crossplane install golang.org/x/tools/cmd/goimports

      - name: Generate Crossplane provider
        run: make -C crossplane generate

      - name: Build & test
        run: cd crossplane && go build ./... && go test ./...

      - name: Compile release runtime architectures
        working-directory: crossplane
        run: |
          set -euo pipefail
          for target_arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$target_arch" go build -trimpath \
              -o "$RUNNER_TEMP/provider-archestra-linux-$target_arch" ./cmd/provider
          done

      - name: Prepare the verified lifecycle runtime
        run: |
          mkdir -p crossplane/_output/bin/linux_amd64
          cp "$RUNNER_TEMP/provider-archestra-linux-amd64" crossplane/_output/bin/linux_amd64/provider
          python3 scripts/ci_runtime_manifest.py write "$RUNNER_TEMP/crossplane-runtime.json" \
            terraform-provider-archestra crossplane/_output/bin/linux_amd64/provider crossplane/package/crds

      - name: Cache the lifecycle runtime
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            terraform-provider-archestra
            crossplane/_output/bin/linux_amd64/provider
            crossplane/package/crds
            ${{ runner.temp }}/crossplane-runtime.json
          key: crossplane-runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
