name: Crossplane Coverage

# Reports which Terraform resources don't yet have a Crossplane managed-resource
# equivalent. Coverage is informational; the tracked badge must be current.
#
# - On PRs that touch either side: writes the report to the job summary.
# - Verify the badge on every run. Update it in the source PR, since main
#   requires pull requests and passing checks.

on:
  # Every pull request runs this job, so the coverage check can be required.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'internal/provider/*.go'
      - 'cmd/provider-contracts/**'
      - 'crossplane/config/external_name.go'
      - 'scripts/crossplane-coverage.sh'
      - 'scripts/test_crossplane_coverage.py'
      - '.github/badges/crossplane-coverage.json'
      - '.github/workflows/crossplane-coverage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Report TF↔Crossplane coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test coverage automation
        run: python3 -m unittest discover -s scripts -p 'test_crossplane_coverage.py'

      - name: Setup Go
        uses: $/.github/actions/setup-go

      - name: Generate coverage report
        run: scripts/crossplane-coverage.sh "$GITHUB_STEP_SUMMARY"

      - name: Verify badge JSON
        run: scripts/crossplane-coverage.sh --check-badge .github/badges/crossplane-coverage.json
