name: Crossplane Lifecycle

# Real both-scope Crossplane reconciliation against the tested Archestra
# release (platform-version.txt): every case group of
# scripts/integration/crossplane-lifecycle.py, split into parallel shards that
# each bring up their own Kind stack, Crossplane and controller.
#
# It runs when a pull request changes provider, Crossplane, harness or stack
# code, on the release pull request, and on demand. The "Crossplane Lifecycle"
# job always reports, so it can be a required check: it fails when a shard
# fails or is cancelled, and passes when every shard passed or none had to run.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select Crossplane lifecycle scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the lifecycle shards run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci_integration_scope.py --suite crossplane \
            --event "$EVENT" --head-ref "$HEAD_REF" --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  lifecycle:
    name: Crossplane Lifecycle (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CROSSPLANE_POLL_INTERVAL: 2s
    strategy:
      fail-fast: false
      # Shards are balanced by recorded run time. Groups that change global
      # settings stay in one shard, because each shard has its own stack.
      matrix:
        include:
          - shard: core
            cases: core observe
          - shard: extensions
            cases: extensions service-account-team team-bindings inline-owners
          - shard: catalog
            cases: catalog tools limit llm credential sharing-defaults
          - shard: organization
            cases: organization organization-defaults identity schedule api-key api-compatibility
          - shard: skills
            cases: skill git-skills repository-plugins manual-plugins marketplace-share-links
          - shard: projects
            cases: apps project-files project-file-init project-instructions knowledge-files
          - shard: routing
            cases: routing-credentials remote-agents github-registrations
          - shard: sharing
            cases: parent-sharing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # crossplane/build makelib
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            crossplane/go.sum

      - name: Read platform version
        run: ./scripts/platform-version.sh >> "$GITHUB_ENV"

      - name: Start the local stack
        run: scripts/bootstrap-local-stack.sh

      # Agent cases install MCP servers; pulling the base image first keeps
      # them inside the platform's readiness window, as acceptance CI does.
      - name: Pull the MCP server base image
        run: |
          kubeconfig=$(mktemp)
          trap 'rm -f "$kubeconfig"' EXIT
          kind get kubeconfig --name archestra-ci-cluster > "$kubeconfig"
          image="europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/mcp-server-base:${ARCHESTRA_VERSION}"
          fixture_images=$(kubectl --kubeconfig="$kubeconfig" create --dry-run=client -f scripts/k8s/provider-mcp-mock.yaml -o jsonpath='{..image}')
          read -ra images <<< "$image $fixture_images"
          for node in $(kind get nodes --name archestra-ci-cluster); do
            for image in "${images[@]}"; do
              for attempt in 1 2 3; do
                if docker exec "$node" crictl pull "$image"; then break; fi
                if [ "$attempt" = 3 ]; then exit 1; fi
                sleep 3
              done
            done
          done

      - name: Install goimports
        run: go -C crossplane install golang.org/x/tools/cmd/goimports

      - name: Start Crossplane and the controller
        run: scripts/bootstrap-crossplane.sh

      - name: Run lifecycle cases
        env:
          CASES: ${{ matrix.cases }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          eval "$(scripts/bootstrap-local-stack.sh --print-env)"
          work="$HOME/.cache/archestra-provider-crossplane/archestra-ci-cluster"
          read -ra groups <<< "$CASES"
          python3 scripts/integration/crossplane-lifecycle.py --cases "${groups[@]}" \
            --api-url "$ARCHESTRA_BASE_URL" --key-file "$work/api-key" --readonly-vault \
            --llm-base-url "$ARCHESTRA_TEST_LLM_BASE_URL" \
            --mcp-url http://provider-mcp-mock.default.svc.cluster.local:19006/mcp \
            --kubeconfig "$work/kubeconfig" --provider-config default \
            --terraform-binary terraform-provider-archestra \
            --controller-binary crossplane/_output/bin/linux_amd64/provider \
            --evidence "$RUNNER_TEMP/crossplane-lifecycle-$SHARD.json"

      - name: Summarize the evidence
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/integration/crossplane-lifecycle-summary.py "$RUNNER_TEMP/crossplane-lifecycle-$SHARD.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Show the controller log
        if: failure()
        run: tail -n 300 "$HOME/.cache/archestra-provider-crossplane/archestra-ci-cluster/controller.log" || true

  result:
    name: Crossplane Lifecycle
    needs: [scope, lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the lifecycle result
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          LIFECYCLE: ${{ needs.lifecycle.result }}
        run: |
          echo "scope=$SCOPE run=$RUN lifecycle=$LIFECYCLE"
          if [ "$SCOPE" != success ]; then exit 1; fi
          if [ "$RUN" = true ] && [ "$LIFECYCLE" != success ]; then exit 1; fi
