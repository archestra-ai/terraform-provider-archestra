# SUBFOLDER NOTE: the upstream reusable
# `crossplane-contrib/provider-workflows/.github/workflows/tag.yml` creates
# an unprefixed `vX.Y.Z` tag. For nested-Go-module subfolder releases we
# instead want `crossplane/vX.Y.Z` (the Go module convention for a module
# at `<repo>/crossplane/`). Until a custom workflow is written, tag the
# Crossplane release manually:
#
#   git tag -a crossplane/v0.1.0 -m "crossplane provider v0.1.0"
#   git push origin crossplane/v0.1.0
#
# Then a separate publish step builds the xpkg from `crossplane/` and
# pushes it.
name: Crossplane Tag (subfolder TODO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0 — will be prefixed with `crossplane/`)'
        required: true
      message:
        description: 'Tag message'
        required: true

jobs:
  tag:
    # Will mis-tag (creates `vX.Y.Z` instead of `crossplane/vX.Y.Z`) until
    # rewritten or replaced with an inline `git tag` step.
    uses: crossplane-contrib/provider-workflows/.github/workflows/tag.yml@451c4dc6ad3691b0a702a997a0ac24e8bbc8bbaa # main
    with:
      version: ${{ github.event.inputs.version }}
      message: ${{ github.event.inputs.message }}
