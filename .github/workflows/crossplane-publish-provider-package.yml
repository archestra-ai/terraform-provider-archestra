# SUBFOLDER NOTE: the upstream reusable
# `crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml`
# assumes single-repo Crossplane provider layout (Makefile at repo root).
# Calling it from this subdir-only crossplane/ requires a custom step or
# fork. Until that exists, this workflow is left as a *reference* only —
# triggering it will fail.
#
# Practical interim option: run `make publish` locally from crossplane/
# after `make schema && make generate && make build`, with the relevant
# secrets exported into the environment.
name: Crossplane Publish Provider Package (subfolder TODO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        default: ''
        required: false
      go-version:
        description: 'Go version to use if building needs to be done'
        default: '1.25'
        required: false

jobs:
  publish-provider-package:
    # Will fail until the reusable supports a subdir argument or this is
    # rewritten as inline steps with `working-directory: crossplane`.
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml@451c4dc6ad3691b0a702a997a0ac24e8bbc8bbaa # main
    with:
      repository: provider-archestra
      version: ${{ github.event.inputs.version }}
      go-version: ${{ github.event.inputs.go-version }}
      cleanup-disk: true
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      XPKG_MIRROR_TOKEN: ${{ secrets.XPKG_MIRROR_TOKEN }}
      XPKG_MIRROR_ACCESS_ID: ${{ secrets.XPKG_MIRROR_ACCESS_ID }}
