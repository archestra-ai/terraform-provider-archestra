name: Acceptance tests
description: Deploy an Archestra release in kind and run the native acceptance suite against it.

inputs:
  archestra-version:
    description: Archestra platform release to deploy, for example 1.5.0-rc.2.
    required: true
  check-generated-client:
    description: Fail when the generated API client differs from this release's spec. Only the tested release must match.
    required: false
    default: "true"
  shard:
    description: One-based shard number; each shard uses an isolated CI runner and stack.
    required: false
    default: "1"
  shard-count:
    description: Number of disjoint shares of the complete Go test suite.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Select platform release
      shell: bash
      env:
        VERSION: ${{ inputs.archestra-version }}
      run: |
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::archestra-version is not a release version: $VERSION"
          exit 1
        fi

    - name: Setup Terraform
      uses: $/.github/actions/setup-terraform

    - name: Setup Archestra Platform
      shell: bash
      env:
        ARCHESTRA_VERSION: ${{ inputs.archestra-version }}
      run: scripts/bootstrap-local-stack.sh

    - name: Restore the exact acceptance test runtime
      id: native-tests
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/native-runtime
        key: native-runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

    - name: Verify cached acceptance runtime
      if: steps.native-tests.outputs.cache-hit == 'true'
      shell: bash
      run: |
        python3 scripts/ci_runtime_manifest.py check "$RUNNER_TEMP/native-runtime/manifest.json" \
          "$RUNNER_TEMP/native-runtime/native-acceptance.test"

    - name: Setup go for generation or a cache miss
      if: steps.native-tests.outputs.cache-hit != 'true' || inputs.check-generated-client == 'true'
      uses: $/.github/actions/setup-go

    - name: Record platform image
      shell: bash
      env:
        ARCHESTRA_VERSION: ${{ inputs.archestra-version }}
      run: |
        nodes=$(kind get nodes --name archestra-ci-cluster)
        test -n "$nodes"
        for node in $nodes; do
          digest=$(docker exec "$node" crictl inspecti "docker.io/archestra/platform:${ARCHESTRA_VERSION}" |
            jq -er '.status | (.repoDigests // []) + [.id] | map(select(. != null and . != "")) | unique | select(length > 0) | join(", ")')
          echo "Archestra ${ARCHESTRA_VERSION} on ${node}: ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
        done

    # The kubelet pulls one image at a time, and at startup the platform queues
    # its agent images. A local MCP server must become ready within two minutes,
    # so pull the platform's default MCP server base image before the tests.
    - name: Pull the MCP server base image
      shell: bash
      env:
        ARCHESTRA_VERSION: ${{ inputs.archestra-version }}
      run: |
        image="europe-west1-docker.pkg.dev/friendly-path-465518-r6/archestra-public/mcp-server-base:${ARCHESTRA_VERSION}"
        for node in $(kind get nodes --name archestra-ci-cluster); do
          docker exec "$node" crictl pull "$image"
        done

    - name: Check for codegen'd API client changes
      if: ${{ inputs.check-generated-client == 'true' }}
      shell: bash
      run: |
        make codegen-api-client

        if ! git diff --exit-code; then
          echo "::error::Generated API client code is not up to date. Please run 'make codegen-api-client' locally and commit the changes."
          exit 1
        fi

    # Sign in with default seeded credentials (admin@example.com / password)
    # and create a fresh API key. Logic is shared with local development via
    # scripts/bootstrap-api-key.sh — keep the script and this step in sync.
    - name: Obtain API Key
      id: api-key
      shell: bash
      env:
        ARCHESTRA_BASE_URL: http://localhost:9000
      run: |
        API_KEY=$(./scripts/bootstrap-api-key.sh)
        echo "::add-mask::${API_KEY}"
        echo "api-key=${API_KEY}" >> "$GITHUB_OUTPUT"

    # Provision a throwaway OIDC identity provider so the enterprise_managed_config
    # acceptance test can exercise the full EMC round-trip. The test skips gracefully
    # if ARCHESTRA_TEST_IDP_ID is unset; in CI we always set it.
    - name: Provision test Identity Provider
      id: test-idp
      shell: bash
      env:
        ARCHESTRA_BASE_URL: http://localhost:9000
        ARCHESTRA_API_KEY: ${{ steps.api-key.outputs.api-key }}
      run: |
        IDP_ID=$(./scripts/bootstrap-test-idp.sh)
        echo "idp-id=${IDP_ID}" >> "$GITHUB_OUTPUT"

    - name: Seed model fixture
      shell: bash
      env:
        ARCHESTRA_BASE_URL: http://localhost:9000
        ARCHESTRA_API_KEY: ${{ steps.api-key.outputs.api-key }}
        ARCHESTRA_READONLY_VAULT_ENABLED: "true"
        ARCHESTRA_TEST_LLM_BASE_URL: http://ollama-mock.default.svc.cluster.local:11434/v1
      run: python3 scripts/bootstrap-test-llm-key.py

    - name: Run Acceptance Tests
      shell: bash
      run: |
        if [ "$CACHED_RUNTIME" = true ]; then
          python3 scripts/ci_acceptance_tests.py --shard "$SHARD" --total "$SHARD_COUNT" \
            --binary "$RUNNER_TEMP/native-runtime/native-acceptance.test"
        else
          python3 scripts/ci_acceptance_tests.py --shard "$SHARD" --total "$SHARD_COUNT"
        fi
      env:
        CACHED_RUNTIME: ${{ steps.native-tests.outputs.cache-hit }}
        SHARD: ${{ inputs.shard }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        ARCHESTRA_BASE_URL: "http://localhost:9000"
        ARCHESTRA_API_KEY: ${{ steps.api-key.outputs.api-key }}
        ARCHESTRA_TEST_IDP_ID: ${{ steps.test-idp.outputs.idp-id }}
        ARCHESTRA_READONLY_VAULT_ENABLED: "true"
        ARCHESTRA_AGENT_RUNTIME_ENABLED: "true"
        ARCHESTRA_ENTERPRISE_LICENSE_ACTIVATED: "true"
        ARCHESTRA_TEST_LLM_BASE_URL: http://ollama-mock.default.svc.cluster.local:11434/v1

    - name: Cluster state on failure
      if: failure()
      shell: bash
      run: |
        kubeconfig=$(mktemp)
        trap 'rm -f "$kubeconfig"' EXIT
        kind get kubeconfig --name archestra-ci-cluster > "$kubeconfig"
        export KUBECONFIG="$kubeconfig"
        kubectl get pods --all-namespaces -o wide || true
        kubectl describe nodes | sed -n '/Allocated resources/,/Events/p' || true
        kubectl get events --all-namespaces --field-selector type=Warning --sort-by=.lastTimestamp || true
        # Events and platform log lines for MCP servers that the tests created.
        kubectl get events --namespace default --sort-by=.lastTimestamp | grep -E 'mcp-tf-' | tail -n 150 || true
        kubectl logs --namespace default deployment/archestra-platform --tail=5000 | grep -E 'mcp-tf-' | tail -n 150 || true
        # Report only warning/error summaries, never request payloads or headers.
        # Git fixture failures can otherwise be hidden behind the MCP-only filter.
        kubectl logs --namespace default deployment/archestra-platform --tail=5000 | \
          jq -Rc 'fromjson? | select(.level >= 40) | {timeIso, msg, error: .err.message}' | tail -n 80 || true
